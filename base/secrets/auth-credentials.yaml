# Secretul `auth-credentials` vine din Vault: kv/prod/jobs-platform/auth-credentials
# (chei: AUTH_DEFAULT_PASSWORD; folosit de auth-service).
# Valorile se schimbă doar în Vault; ESO le citește la o oră, apoi restart la pod-uri.
# SecretStore-ul `vault` din namespace este generat de Kyverno (generate-namespace-vault-secrets).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-credentials
  annotations:
    # Înaintea deployment-urilor, ca Secretul să existe când pornesc pod-urile.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: auth-credentials
    creationPolicy: Owner
    # Dacă cheia dispare din Vault, Secretul rămâne cu ultimele valori. Ștergerea
    # ExternalSecret-ului șterge însă și Secretul (ownerReference).
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: prod/jobs-platform/auth-credentials
