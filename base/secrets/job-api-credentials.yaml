# Secretul `job-api-credentials` vine din Vault: kv/prod/jobs-platform/job-api-credentials
# (chei: JOBS_ADZUNA_APP_ID, JOBS_ADZUNA_APP_KEY, JOBS_CAREERJET_API_KEY, JOBS_CAREERJET_USER_IP, JOBS_GREENHOUSE_BOARD_TOKENS; folosit de job-service).
# Valorile se schimbă doar în Vault; ESO le citește la o oră, apoi restart la pod-uri.
# SecretStore-ul `vault` din namespace este generat de Kyverno (generate-namespace-vault-secrets).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: job-api-credentials
  annotations:
    # Înaintea deployment-urilor, ca Secretul să existe când pornesc pod-urile.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: job-api-credentials
    creationPolicy: Owner
    # Dacă cheia dispare din Vault, Secretul rămâne cu ultimele valori. Ștergerea
    # ExternalSecret-ului șterge însă și Secretul (ownerReference).
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: prod/jobs-platform/job-api-credentials
