apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: jobs-platform
  labels:
    app: auth-service
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        app.kubernetes.io/name: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/pascariucosmin93/auth-service:0.0.13
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:+UseSerialGC
                -Xms32m
                -Xmx200m
                -XX:MaxMetaspaceSize=96m
                -XX:TieredStopAtLevel=1
            - name: POSTGRES_HOST
              value: "postgress.cosmin.home"
            - name: POSTGRES_DB
              value: "auth"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: AUTH_DEFAULT_USERNAME
              value: "cosmin"
            - name: AUTH_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-credentials
                  key: AUTH_DEFAULT_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
